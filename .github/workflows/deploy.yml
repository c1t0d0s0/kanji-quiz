# Publishes the site to GitHub Pages whenever main is pushed
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Can also be run by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never stop a deployment in progress; only cancel older runs that are still waiting
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Stop here if a test fails, or the 熟語 list does not match the kanji list (tests/data.test.ts)
      - run: npm test
      # config.js is not tracked by Git, so vite.config.ts reads the same names from the
      # repository variables. GTM_ID embeds the Google tag; the four FIREBASE_* values enable
      # Google sign-in and saving to Firestore; FIREBASE_DATABASE_URL also enables the
      # 意味かるた たいせん. Variables that are not registered stay empty (feature off).
      - name: Build the site into dist
        env:
          GTM_ID: ${{ vars.GTM_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
