<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字クイズ</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S6QX2XHT2D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', config.gtagId);
    </script>
</head>
<body>
    <div id="start-screen" class="screen active">
        <h1>漢字クイズ</h1>
        <p>小学校1・2年生レベル</p>
        <div class="mode-selection">
            <div class="mode">
                <h2>漢字から読み</h2>
                <p>表示された漢字の読みを当てよう！</p>
                <button id="start-k-to-y" class="start-btn">スタート</button>
            </div>
            <div class="mode">
                <h2>読みから漢字</h2>
                <p>表示された読みの漢字を当てよう！</p>
                <button id="start-y-to-k" class="start-btn">スタート</button>
            </div>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="quiz-header">
            <p id="question-counter">第1問</p>
            <div id="timer">10</div>
        </div>
        <div id="question-area">
            <p id="question"></p>
        </div>
        <div id="options-area" class="options">
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
        </div>
        <div id="feedback-area">
            <p id="feedback"></p>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h1>結果発表</h1>
        <p id="score">正解率: 100%</p>
        <p id="message">おめでとう！パーフェクト！</p>
        <button id="retry-btn">もう一度挑戦する</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
